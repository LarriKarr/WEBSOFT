<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Универсальный Медиаплеер PRO</title>
  <style>
    :root {
      --bg-color: #0f111a;
      --panel-bg: rgba(22, 26, 38, 0.95);
      --accent-color: #7c4dff;
      --accent-hover: #651fff;
      --text-color: #e0e6ed;
      --text-muted: #8a99ad;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    .main-content {
      flex: 1;
      display: flex;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .viewport {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      cursor: pointer;
      overflow: hidden;
    }

    .viewport.drag-over::after {
      content: "Перетащите файлы сюда";
      position: absolute;
      inset: 0;
      background: rgba(124, 77, 255, 0.8);
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: filter 0.1s linear;
    }

    #visualizerCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .cover-art-display {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      object-fit: cover;
      display: none;
      z-index: 2;
    }

    /* Вертикальные слайдеры слева (Яркость) и справа (Громкость) */
    .vertical-slider-container {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 6px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      z-index: 14;
      transition: opacity 0.3s ease;
    }

    .vertical-slider-container.left { left: 12px; }
    .vertical-slider-container.right { right: 12px; }

    .slider-vertical {
      writing-mode: bt-lr;
      -webkit-appearance: slider-vertical;
      width: 8px;
      height: 110px;
      cursor: pointer;
    }

    /* Оверлей управления */
    .overlay-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 20%, rgba(0, 0, 0, 0.6) 70%, transparent);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 12;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.3s ease;
    }

    .viewport.hide-controls .overlay-controls,
    .viewport.hide-controls .vertical-slider-container {
      opacity: 0;
      pointer-events: none;
    }

    .gesture-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 20;
    }

    /* Подсказка таймера при наведении на прогресс-бар */
    .progress-container {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .scrub-tooltip {
      position: absolute;
      bottom: 25px;
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      pointer-events: none;
      display: none;
      transform: translateX(-50%);
    }

    .time-text {
      font-size: 0.8rem;
      color: var(--text-color);
      width: 45px;
      text-align: center;
    }

    .slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
    }

    .buttons-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 8px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: var(--accent-color);
    }

    .control-btn.primary {
      background: var(--accent-color);
      border: none;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
    }

    .control-btn.primary:hover {
      background: var(--accent-hover);
    }

    select.btn-secondary, select.control-btn {
      color: var(--text-color);
      outline: none;
      padding: 0 6px;
      height: 38px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    select.btn-secondary option, select.control-btn option {
      background: var(--bg-color);
      color: var(--text-color);
    }

    /* Плейлист */
    .sidebar {
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 15;
    }

    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
    }

    .btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); }

    .playlist {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .playlist-item {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s;
    }

    .playlist-item:hover { background: rgba(255, 255, 255, 0.05); }

    .playlist-item.active {
      background: rgba(124, 77, 255, 0.25);
      border-left: 4px solid var(--accent-color);
    }

    .item-info {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .item-title {
      font-size: 0.9rem;
      color: var(--text-color);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Модальные окна */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #1a1d29;
      padding: 24px;
      border-radius: 12px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border-color);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .input-group input, .input-group select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: white;
      padding: 8px;
      border-radius: 6px;
      outline: none;
    }

    .eq-bands {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }

    .eq-band {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
    }

    .media-only { display: none !important; }
    .media-only.visible { display: inline-flex !important; }

    @media (max-width: 768px) {
      .main-content { flex-direction: column; }
      .sidebar { width: 100%; height: 220px; }
    }
  </style>
	<script>
  // 1. Динамическая генерация манифеста под каждый отдельный HTML файл
  const dynamicManifest = {
    "name": document.title || "Мое веб-приложение",
    "short_name": document.title.split(' ')[0] || "App",
    "start_url": window.location.pathname.split('/').pop() || "./index.html",
    "display": "standalone",
    "background_color": "#121214",
    "theme_color": "#0070f3",
    "icons": [
      {
        "src": "https://cdn-icons-png.flaticon.com/512/3076/3076137.png",
        "sizes": "192x192",
        "type": "image/png"
      },
      {
        "src": "https://cdn-icons-png.flaticon.com/512/3076/3076137.png",
        "sizes": "512x512",
        "type": "image/png"
      }
    ]
  };

  const stringManifest = JSON.stringify(dynamicManifest);
  const blob = new Blob([stringManifest], { type: 'application/manifest+json' });
  const manifestURL = URL.createObjectURL(blob);
  
  const manifestTag = document.createElement('link');
  manifestTag.rel = 'manifest';
  manifestTag.href = manifestURL;
  document.head.appendChild(manifestTag);

  // 2. Регистрация универсального Service Worker из корня папки
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Универсальный SW зарегистрирован для:', document.title))
        .catch((err) => console.log('Ошибка SW:', err));
    });
  }
</script>

</head>
<body>

<div class="app-container" id="appContainer">
  <div class="main-content">
    <div class="viewport" id="viewport">
      <video id="mediaElement" playsinline></video>
      <canvas id="visualizerCanvas"></canvas>
      <img id="coverArt" class="cover-art-display" alt="Обложка">
      
      <div class="gesture-indicator" id="gestureIndicator">--</div>

      <!-- Слайдер яркости -->
      <div class="vertical-slider-container left" id="brightnessContainer">
        <span style="font-size: 0.8rem;">☀️</span>
        <input type="range" class="slider-vertical" id="brightnessSlider" min="0.2" max="1.5" step="0.05" value="1">
      </div>

      <!-- Слайдер громкости -->
      <div class="vertical-slider-container right" id="volumeContainer">
        <span style="font-size: 0.8rem;">🔊</span>
        <input type="range" class="slider-vertical" id="volumeSlider" min="0" max="1" step="0.05" value="1">
      </div>

      <!-- Панель управления -->
      <div class="overlay-controls" id="overlayControls">
        <div class="progress-container">
          <div class="scrub-tooltip" id="scrubTooltip">00:00</div>
          <span class="time-text" id="currentTime">00:00</span>
          <input type="range" class="slider" id="progressBar" value="0" min="0" max="100" step="0.1">
          <span class="time-text" id="durationTime">00:00</span>
        </div>

        <div class="buttons-container">
          <div class="control-group">
            <button class="control-btn" id="prevBtn" title="Предыдущий">⏮</button>
            <button class="control-btn primary" id="playBtn" title="Плей / Пауза (Пробел)">▶</button>
            <button class="control-btn" id="nextBtn" title="Следующий">⏭</button>
            <button class="control-btn" id="modeBtn" title="Режим: По порядку">🔁</button>

            <!-- Эквалайзер -->
            <button class="control-btn media-only" id="openEqBtn" title="Эквалайзер">🎚️</button>

            <!-- Визуализатор -->
            <select id="vizSelect" class="btn-secondary media-only" title="Визуализатор">
              <option value="bars">📊 Спектр</option>
              <option value="wave">〰️ Волна</option>
              <option value="circle">⭕ Круг</option>
              <option value="matrix">💻 Матрица</option>
            </select>

            <!-- Скорость -->
            <select id="speedSelect" class="control-btn media-only" title="Скорость">
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1" selected>1.0x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2.0">2.0x</option>
            </select>

            <!-- Субтитры -->
            <label class="control-btn media-only" id="subLabel" title="Субтитры">
              💬
              <input type="file" id="subInput" accept=".srt,.vtt" hidden>
            </label>
            <button class="control-btn media-only" id="openSubSettingsBtn" title="Настройки субтитров">⚙️</button>

            <button class="control-btn media-only" id="openTagsBtn" title="Редактор тегов">🏷️</button>
            <button class="control-btn media-only" id="pipBtn" title="Плавающее окно (PiP)">📺</button>
          </div>

          <div class="control-group">
            <button class="control-btn primary" id="fullscreenBtn" title="Развернуть на весь экран (F)">⛶</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Боковая панель -->
    <div class="sidebar">
      <div class="sidebar-header">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по плейлисту...">
        <div style="display: flex; gap: 8px;">
          <label class="btn" style="flex:1; justify-content:center;">
            📂 Файлы
            <input type="file" id="fileInput" multiple accept="audio/*,video/*,.srt,.vtt" hidden>
          </label>
          <label class="btn btn-secondary" style="flex:1; justify-content:center;">
            📁 Папка
            <input type="file" id="folderInput" webkitdirectory directory hidden>
          </label>
        </div>
      </div>
      <ul class="playlist" id="playlist"></ul>
    </div>
  </div>
</div>

<!-- Модальное окно: Редактор метатегов -->
<div class="modal" id="tagModal">
  <div class="modal-content">
    <h3>Редактировать метатеги</h3>
    <div class="input-group">
      <label>Название</label>
      <input type="text" id="tagTitle">
    </div>
    <div class="input-group">
      <label>Исполнитель</label>
      <input type="text" id="tagArtist">
    </div>
    <div class="input-group">
      <label>Альбом</label>
      <input type="text" id="tagAlbum">
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
      <button class="btn btn-secondary" id="closeTagsBtn">Отмена</button>
      <button class="btn" id="saveTagsBtn">Сохранить</button>
    </div>
  </div>
</div>

<!-- Модальное окно: Эквалайзер -->
<div class="modal" id="eqModal">
  <div class="modal-content">
    <h3>Эквалайзер</h3>
    <div class="input-group">
      <label>Пресет</label>
      <select id="eqPreset">
        <option value="flat">Flat (Сброс)</option>
        <option value="rock">Rock</option>
        <option value="pop">Pop</option>
        <option value="bass">Bass Boost</option>
        <option value="classic">Classic</option>
      </select>
    </div>
    <div class="eq-bands">
      <div class="eq-band"><span>60Hz</span><input type="range" class="slider-vertical" id="eq60" min="-12" max="12" value="0"></div>
      <div class="eq-band"><span>230Hz</span><input type="range" class="slider-vertical" id="eq230" min="-12" max="12" value="0"></div>
      <div class="eq-band"><span>910Hz</span><input type="range" class="slider-vertical" id="eq910" min="-12" max="12" value="0"></div>
      <div class="eq-band"><span>4kHz</span><input type="range" class="slider-vertical" id="eq4k" min="-12" max="12" value="0"></div>
      <div class="eq-band"><span>14kHz</span><input type="range" class="slider-vertical" id="eq14k" min="-12" max="12" value="0"></div>
    </div>
    <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
      <button class="btn" id="closeEqBtn">Готово</button>
    </div>
  </div>
</div>

<!-- Модальное окно: Настройки субтитров -->
<div class="modal" id="subModal">
  <div class="modal-content">
    <h3>Настройки субтитров</h3>
    <div class="input-group">
      <label>Размер текста (px)</label>
      <input type="number" id="subFontSize" value="20" min="12" max="40">
    </div>
    <div class="input-group">
      <label>Смещение тайминга (сек)</label>
      <input type="number" id="subOffset" value="0" step="0.5">
    </div>
    <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
      <button class="btn" id="closeSubBtn">Применить</button>
    </div>
  </div>
</div>

<script>
  const media = document.getElementById('mediaElement');
  const viewport = document.getElementById('viewport');
  const overlayControls = document.getElementById('overlayControls');
  const canvas = document.getElementById('visualizerCanvas');
  const ctx = canvas.getContext('2d');
  const coverArt = document.getElementById('coverArt');
  const playlistEl = document.getElementById('playlist');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const modeBtn = document.getElementById('modeBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const speedSelect = document.getElementById('speedSelect');
  const progressBar = document.getElementById('progressBar');
  const scrubTooltip = document.getElementById('scrubTooltip');
  const currentTimeEl = document.getElementById('currentTime');
  const durationTimeEl = document.getElementById('durationTime');
  const volumeSlider = document.getElementById('volumeSlider');
  const brightnessSlider = document.getElementById('brightnessSlider');
  const vizSelect = document.getElementById('vizSelect');
  const openTagsBtn = document.getElementById('openTagsBtn');
  const subLabel = document.getElementById('subLabel');
  const openSubSettingsBtn = document.getElementById('openSubSettingsBtn');
  const pipBtn = document.getElementById('pipBtn');
  const openEqBtn = document.getElementById('openEqBtn');
  const gestureIndicator = document.getElementById('gestureIndicator');
  const searchInput = document.getElementById('searchInput');

  let playlist = [];
  let currentIndex = -1;
  let playMode = 0;
  let audioCtx, analyser, sourceNode;
  let eqFilters = [];
  let isAudio = false;
  let hideControlsTimeout;

  const modes = [
    { icon: '🔁', title: 'Режим: По порядку' },
    { icon: '🔂', title: 'Режим: Повтор трека' },
    { icon: '🔀', title: 'Режим: Вразброс' }
  ];

  // Загрузка настроек из LocalStorage
  function loadSavedSettings() {
    if (localStorage.getItem('media_vol')) {
      volumeSlider.value = localStorage.getItem('media_vol');
      media.volume = volumeSlider.value;
    }
    if (localStorage.getItem('media_bright')) {
      brightnessSlider.value = localStorage.getItem('media_bright');
      media.style.filter = `brightness(${brightnessSlider.value})`;
    }
  }
  loadSavedSettings();

  function resizeCanvas() {
    canvas.width = viewport.clientWidth;
    canvas.height = viewport.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function showControls() {
    viewport.classList.remove('hide-controls');
    clearTimeout(hideControlsTimeout);
    hideControlsTimeout = setTimeout(() => {
      if (!media.paused) {
        viewport.classList.add('hide-controls');
      }
    }, 3500);
  }

  viewport.addEventListener('click', (e) => {
    if (overlayControls.contains(e.target) || 
        document.getElementById('brightnessContainer').contains(e.target) || 
        document.getElementById('volumeContainer').contains(e.target)) return;
    
    if (viewport.classList.contains('hide-controls')) {
      showControls();
    } else {
      viewport.classList.add('hide-controls');
    }
  });

  viewport.addEventListener('mousemove', showControls);

  // Drag and Drop файлов
  viewport.addEventListener('dragover', (e) => {
    e.preventDefault();
    viewport.classList.add('drag-over');
  });
  viewport.addEventListener('dragleave', () => viewport.classList.remove('drag-over'));
  viewport.addEventListener('drop', (e) => {
    e.preventDefault();
    viewport.classList.remove('drag-over');
    handleFiles(e.dataTransfer.files);
  });

  // Управление яркостью и громкостью
  brightnessSlider.addEventListener('input', () => {
    const val = brightnessSlider.value;
    media.style.filter = `brightness(${val})`;
    localStorage.setItem('media_bright', val);
    showIndicator(`☀️ Яркость: ${Math.round(val * 100)}%`);
  });

  volumeSlider.addEventListener('input', () => {
    media.volume = volumeSlider.value;
    localStorage.setItem('media_vol', volumeSlider.value);
    showIndicator(`🔊 Громкость: ${Math.round(media.volume * 100)}%`);
  });

  // Поиск по плейлисту
  searchInput.addEventListener('input', () => renderPlaylist());

  document.getElementById('fileInput').addEventListener('change', (e) => handleFiles(e.target.files));
  document.getElementById('folderInput').addEventListener('change', (e) => handleFiles(e.target.files));

  function handleFiles(files) {
    for (let file of files) {
      if (file.type.startsWith('audio/') || file.type.startsWith('video/') || file.name.endsWith('.mkv')) {
        playlist.push({
          file: file,
          name: file.name,
          title: file.name,
          artist: 'Неизвестен',
          album: '',
          type: file.type.startsWith('video/') || file.name.endsWith('.mkv') ? 'video' : 'audio'
        });
      }
    }
    renderPlaylist();
    if (currentIndex === -1 && playlist.length > 0) {
      loadTrack(0);
    }
  }

  function renderPlaylist() {
    const query = searchInput.value.toLowerCase();
    playlistEl.innerHTML = '';
    playlist.forEach((item, index) => {
      if (item.title.toLowerCase().includes(query) || item.artist.toLowerCase().includes(query)) {
        const li = document.createElement('li');
        li.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
        li.innerHTML = `
          <div class="item-info">
            <div class="item-title">${item.title}</div>
            <div class="item-sub">${item.artist} • ${item.type.toUpperCase()}</div>
          </div>
        `;
        li.onclick = () => loadTrack(index);
        playlistEl.appendChild(li);
      }
    });
  }

  function loadTrack(index) {
    if (index < 0 || index >= playlist.length) return;
    currentIndex = index;
    const item = playlist[currentIndex];

    media.src = URL.createObjectURL(item.file);
    isAudio = item.type === 'audio';
    media.playbackRate = parseFloat(speedSelect.value);

    speedSelect.classList.add('visible');
    openTagsBtn.classList.add('visible');
    openEqBtn.classList.add('visible');
    pipBtn.classList.add('visible');

    if (isAudio) {
      coverArt.style.display = 'block';
      canvas.style.display = 'block';
      vizSelect.classList.add('visible');
      subLabel.classList.remove('visible');
      openSubSettingsBtn.classList.remove('visible');
      coverArt.src = item.cover || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="%237c4dff"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>';
      initAudioContext();
    } else {
      coverArt.style.display = 'none';
      canvas.style.display = 'none';
      vizSelect.classList.remove('visible');
      subLabel.classList.add('visible');
      openSubSettingsBtn.classList.add('visible');

      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    }

    renderPlaylist();
    media.play();
    playBtn.textContent = '⏸';
    showControls();
    updateMediaSession(item);
  }

  // Web Audio API + Эквалайзер
  function initAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      sourceNode = audioCtx.createMediaElementSource(media);

      // Создаем 5 полос эквалайзера
      const freqs = [60, 230, 910, 4000, 14000];
      eqFilters = freqs.map(freq => {
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'peaking';
        filter.frequency.value = freq;
        filter.Q.value = 1;
        filter.gain.value = 0;
        return filter;
      });

      // Связываем цепь: Source -> Eq1 -> Eq2... -> Analyser -> Destination
      let currentNode = sourceNode;
      eqFilters.forEach(filter => {
        currentNode.connect(filter);
        currentNode = filter;
      });
      currentNode.connect(analyser);
      analyser.connect(audioCtx.destination);

      drawVisualizer();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    if (!isAudio) return;

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    const mode = vizSelect.value;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (mode === 'bars') {
      analyser.getByteFrequencyData(dataArray);
      const barWidth = (canvas.width / bufferLength) * 2.5;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        ctx.fillStyle = `hsl(${i * 4}, 100%, 50%)`;
        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
      }
    } else if (mode === 'wave') {
      analyser.getByteTimeDomainData(dataArray);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#7c4dff';
      ctx.beginPath();
      const sliceWidth = canvas.width / bufferLength;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = (v * canvas.height) / 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        x += sliceWidth;
      }
      ctx.stroke();
    } else if (mode === 'circle') {
      analyser.getByteFrequencyData(dataArray);
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 80;
      ctx.beginPath();
      for (let i = 0; i < bufferLength; i++) {
        const angle = (i / bufferLength) * Math.PI * 2;
        const r = radius + (dataArray[i] / 255) * 50;
        const x = centerX + Math.cos(angle) * r;
        const y = centerY + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 3;
      ctx.stroke();
    } else if (mode === 'matrix') {
      analyser.getByteFrequencyData(dataArray);
      ctx.fillStyle = '#0f0';
      ctx.font = '12px monospace';
      for (let i = 0; i < bufferLength; i += 4) {
        const char = String.fromCharCode(0x30A0 + Math.random() * 96);
        const y = (dataArray[i] / 255) * canvas.height;
        ctx.fillText(char, (i / bufferLength) * canvas.width, y);
      }
    }
  }

  // Горячие клавиши (Keyboard Shortcuts)
  window.addEventListener('keydown', (e) => {
    if (['input', 'select', 'textarea'].includes(document.activeElement.tagName.toLowerCase())) return;

    switch (e.key.toLowerCase()) {
      case ' ':
      case 'k':
        e.preventDefault();
        playBtn.click();
        break;
      case 'arrowleft':
      case 'j':
        media.currentTime -= 5;
        showIndicator('⏪ -5s');
        break;
      case 'arrowright':
      case 'l':
        media.currentTime += 5;
        showIndicator('⏩ +5s');
        break;
      case 'arrowup':
        media.volume = Math.min(1, media.volume + 0.1);
        volumeSlider.value = media.volume;
        showIndicator(`🔊 Громкость: ${Math.round(media.volume * 100)}%`);
        break;
      case 'arrowdown':
        media.volume = Math.max(0, media.volume - 0.1);
        volumeSlider.value = media.volume;
        showIndicator(`🔊 Громкость: ${Math.round(media.volume * 100)}%`);
        break;
      case 'f':
        fullscreenBtn.click();
        break;
      case 'm':
        media.muted = !media.muted;
        showIndicator(media.muted ? '🔇 Звук выключен' : '🔊 Звук включен');
        break;
    }
  });

  playBtn.onclick = () => {
    if (media.paused) {
      media.play();
      playBtn.textContent = '⏸';
      showControls();
    } else {
      media.pause();
      playBtn.textContent = '▶';
      viewport.classList.remove('hide-controls');
    }
  };

  prevBtn.onclick = () => {
    if (playlist.length === 0) return;
    if (playMode === 2) {
      loadTrack(Math.floor(Math.random() * playlist.length));
    } else {
      loadTrack((currentIndex - 1 + playlist.length) % playlist.length);
    }
  };

  nextBtn.onclick = () => playNext();

  function playNext() {
    if (playlist.length === 0) return;
    if (playMode === 1) {
      media.currentTime = 0;
      media.play();
    } else if (playMode === 2) {
      let nextIdx;
      do {
        nextIdx = Math.floor(Math.random() * playlist.length);
      } while (nextIdx === currentIndex && playlist.length > 1);
      loadTrack(nextIdx);
    } else {
      loadTrack((currentIndex + 1) % playlist.length);
    }
  }

  media.onended = () => playNext();

  modeBtn.onclick = () => {
    playMode = (playMode + 1) % modes.length;
    modeBtn.textContent = modes[playMode].icon;
    modeBtn.title = modes[playMode].title;
  };

  fullscreenBtn.onclick = () => {
    if (!document.fullscreenElement) {
      if (viewport.requestFullscreen) viewport.requestFullscreen();
      else if (viewport.webkitRequestFullscreen) viewport.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  };

  speedSelect.onchange = () => media.playbackRate = parseFloat(speedSelect.value);

  // Синхронизация прогресса и превью-таймер
  media.ontimeupdate = () => {
    if (!isNaN(media.duration)) {
      progressBar.value = (media.currentTime / media.duration) * 100;
      currentTimeEl.textContent = formatTime(media.currentTime);
      durationTimeEl.textContent = formatTime(media.duration);
    }
  };

  progressBar.addEventListener('mousemove', (e) => {
    const rect = progressBar.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    const time = pos * media.duration;
    if (!isNaN(time)) {
      scrubTooltip.style.left = `${e.clientX - rect.left}px`;
      scrubTooltip.textContent = formatTime(time);
      scrubTooltip.style.display = 'block';
    }
  });

  progressBar.addEventListener('mouseleave', () => scrubTooltip.style.display = 'none');
  progressBar.oninput = () => media.currentTime = (progressBar.value / 100) * media.duration;

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
  }

  // Настройка эквалайзера
  const eqModal = document.getElementById('eqModal');
  openEqBtn.onclick = () => eqModal.style.display = 'flex';
  document.getElementById('closeEqBtn').onclick = () => eqModal.style.display = 'none';

  const eqSliders = ['eq60', 'eq230', 'eq910', 'eq4k', 'eq14k'].map((id, idx) => {
    const slider = document.getElementById(id);
    slider.oninput = () => {
      if (eqFilters[idx]) eqFilters[idx].gain.value = slider.value;
    };
    return slider;
  });

  document.getElementById('eqPreset').onchange = (e) => {
    const presets = {
      flat: [0, 0, 0, 0, 0],
      rock: [5, 3, -1, 3, 5],
      pop: [-1, 2, 4, 2, -1],
      bass: [8, 6, 2, 0, 0],
      classic: [4, 3, 0, 2, 4]
    };
    const vals = presets[e.target.value] || presets.flat;
    vals.forEach((v, i) => {
      eqSliders[i].value = v;
      if (eqFilters[i]) eqFilters[i].gain.value = v;
    });
  };

  // Настройки субтитров
  const subModal = document.getElementById('subModal');
  openSubSettingsBtn.onclick = () => subModal.style.display = 'flex';
  document.getElementById('closeSubBtn').onclick = () => {
    const size = document.getElementById('subFontSize').value;
    const style = document.createElement('style');
    style.innerHTML = `video::cue { font-size: ${size}px; }`;
    document.head.appendChild(style);
    subModal.style.display = 'none';
  };

  document.getElementById('subInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const track = document.createElement('track');
      track.kind = 'subtitles';
      track.label = 'Субтитры';
      track.srclang = 'ru';
      track.src = URL.createObjectURL(file);
      track.default = true;
      media.appendChild(track);
    }
  });

  pipBtn.onclick = async () => {
    try {
      if (media !== document.pictureInPictureElement) await media.requestPictureInPicture();
      else await document.exitPictureInPicture();
    } catch (err) { console.error(err); }
  };

  function updateMediaSession(item) {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: item.title,
        artist: item.artist,
        album: item.album
      });
      navigator.mediaSession.setActionHandler('play', () => media.play());
      navigator.mediaSession.setActionHandler('pause', () => media.pause());
      navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
    }
  }

  function showIndicator(text) {
    gestureIndicator.textContent = text;
    gestureIndicator.style.opacity = '1';
    clearTimeout(gestureIndicator.timer);
    gestureIndicator.timer = setTimeout(() => gestureIndicator.style.opacity = '0', 1000);
  }

  // Редактор тегов
  const tagModal = document.getElementById('tagModal');
  openTagsBtn.onclick = () => {
    if (currentIndex === -1) return;
    const item = playlist[currentIndex];
    document.getElementById('tagTitle').value = item.title;
    document.getElementById('tagArtist').value = item.artist;
    document.getElementById('tagAlbum').value = item.album;
    tagModal.style.display = 'flex';
  };

  document.getElementById('closeTagsBtn').onclick = () => tagModal.style.display = 'none';
  document.getElementById('saveTagsBtn').onclick = () => {
    if (currentIndex !== -1) {
      playlist[currentIndex].title = document.getElementById('tagTitle').value;
      playlist[currentIndex].artist = document.getElementById('tagArtist').value;
      playlist[currentIndex].album = document.getElementById('tagAlbum').value;
      renderPlaylist();
      updateMediaSession(playlist[currentIndex]);
    }
    tagModal.style.display = 'none';
  };
</script>
</body>
</html>
