<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pocket Animator Pro</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
    body { display: flex; flex-direction: column; height: 100dvh; background: #1e1e24; color: #fff; overflow: hidden; }
    
    #header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; background: #18181f; border-bottom: 1px solid #333; z-index: 11; flex-shrink: 0;
    }
    .logo { font-weight: bold; font-size: 15px; color: #00d2ff; }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    
    .icon-btn {
      background: #3b3b4f; color: white; border: 1px solid #555; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    .icon-btn:active { background: #555577; }

    /* Панель инструментов со смарт-кнопками */
    #toolbar {
      display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; background: #2b2b36; border-bottom: 1px solid #333; z-index: 10; flex-shrink: 0;
    }
    .toolbar-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; width: 100%; }
    .tool-group { display: flex; align-items: center; gap: 4px; }

    button.tool-btn {
      background: #3b3b4f; color: white; border: 1px solid #555; width: 34px; height: 32px; border-radius: 4px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; overflow: hidden; white-space: nowrap; padding: 0;
    }
    button.tool-btn span { display: none; }
    button.tool-btn.active {
      width: auto; padding: 0 8px; background: #00d2ff; color: #000; font-weight: bold; border-color: #00d2ff; font-size: 11px; gap: 4px;
    }
    button.tool-btn.active span { display: inline; }
    button:active { opacity: 0.8; }
    
    input[type="color"] { border: none; width: 30px; height: 30px; cursor: pointer; background: none; padding: 0; border-radius: 4px; }
    input[type="range"] { accent-color: #00d2ff; cursor: pointer; }

    #workspace-layout {
      flex: 1; display: flex; position: relative; overflow: hidden; min-height: 0; background: #15151a;
    }
    
    #workspace {
      flex: 1; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; padding: 4px;
      background-image: linear-gradient(45deg, #22222a 25%, transparent 25%), linear-gradient(-45deg, #22222a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #22222a 75%), linear-gradient(-45deg, transparent 75%, #22222a 75%);
      background-size: 15px 15px; background-position: 0 0, 0 7.5px, 7.5px -7.5px, -7.5px 0px;
    }
    
    .canvas-container { 
      position: relative; width: 100%; height: 100%; max-width: 100%; max-height: 100%; aspect-ratio: 1/1; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 4px; touch-action: none; }
    
    /* Правая панель слоев */
    #layers-sidebar {
      width: 95px; background: #21212b; border-left: 1px solid #333; display: flex; flex-direction: column; padding: 4px; gap: 6px; flex-shrink: 0; z-index: 12; overflow-y: auto;
    }
    .history-group { display: flex; gap: 4px; justify-content: center; border-bottom: 1px solid #333; padding-bottom: 6px; }
    .history-group button { width: 38px; height: 28px; font-size: 12px; border-radius: 4px; border: 1px solid #555; background: #3b3b4f; color:#fff; cursor:pointer; }

    .layer-card {
      background: #2b2b36; border: 1px solid #444; border-radius: 4px; padding: 4px; display: flex; flex-direction: column; gap: 3px; font-size: 10px;
    }
    .layer-card.active { border-color: #00d2ff; background: #323246; }
    .layer-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; }
    .layer-actions-row { display: flex; justify-content: space-between; align-items: center; font-size: 9px; color: #aaa; }
    .layer-btn { background: #3b3b4f; border: 1px solid #555; color: #fff; border-radius: 2px; width: 16px; height: 16px; font-size: 9px; cursor: pointer; display: flex; justify-content: center; align-items: center; }

    /* Таймлайн */
    #timeline-container { background: #2b2b36; border-top: 1px solid #333; flex-shrink: 0; display: flex; align-items: center; padding: 6px 10px; gap: 8px; }
    
    #playBtn {
      width: 45px; height: 45px; background: #00d2ff; color: #000; border: none; border-radius: 4px; font-weight: bold; font-size: 18px; cursor: pointer; flex-shrink: 0; display: flex; justify-content: center; align-items: center;
    }
    #playBtn.playing { background: #ff4444; color: #fff; }

    #fpsSelector {
      width: 100%; background: #3b3b4f; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 4px; font-size: 10px; cursor: pointer; text-align: center; margin-top: auto;
    }

    #timeline { display: flex; gap: 6px; overflow-x: auto; height: 55px; align-items: center; width: 100%; }
    
    .thumb {
      min-width: 60px; height: 45px; border: 2px solid #555; border-radius: 4px; background-size: contain; background-repeat: no-repeat; background-position: center; cursor: pointer; flex-shrink: 0; background-color: #111; position: relative;
    }
    .thumb.active { border-color: #00d2ff; }
    .thumb-actions { position: absolute; top: -6px; right: -6px; display: none; gap: 2px; }
    .thumb:hover .thumb-actions { display: flex; }
    .thumb-action-btn { background: #111; color: #fff; border: 1px solid #777; border-radius: 50%; width: 16px; height: 16px; font-size: 9px; display: flex; justify-content: center; align-items: center; cursor: pointer; }

    .thumb-add {
      min-width: 60px; height: 45px; border: 2px dashed #777; border-radius: 4px; background: rgba(255,255,255,0.05); cursor: pointer; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #aaa; opacity: 0.7;
    }
    .thumb-add:active { opacity: 1; border-color: #00d2ff; color: #00d2ff; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 100;
    }
    .modal { background: #2b2b36; padding: 20px; border-radius: 8px; border: 1px solid #444; width: 320px; display: flex; flex-direction: column; gap: 12px; }
    .modal h3 { font-size: 15px; }
    .modal-group { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .size-input { width: 60px; text-align: center; background: #3b3b4f; color: white; border: 1px solid #555; border-radius: 4px; padding: 4px; }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div id="header">
    <div class="logo">🎨 Pocket Animator Pro</div>
    <div class="header-actions">
      <button class="icon-btn" id="importMediaBtn" title="Импорт видео / GIF / картинок">📥</button>
      <input type="file" id="mediaFileInput" accept="video/*,image/gif,image/*" multiple style="display:none">
      <button class="icon-btn" id="settingsBtn" title="Настройки и Фон">⚙️</button>
      <button class="icon-btn" id="exportVideoBtn" title="Экспорт">🎥</button>
      <button class="icon-btn" id="saveProjectBtn" title="Сохранить проект">💾</button>
      <input type="file" id="loadProjectInput" accept=".json" style="display:none">
      <button class="icon-btn" id="loadProjectBtn" title="Открыть проект">📂</button>
    </div>
  </div>

  <!-- Панель инструментов -->
  <div id="toolbar">
    <div class="toolbar-row">
      <div class="tool-group">
        <button id="brushBtn" class="tool-btn active" title="Кисть" onclick="selectTool('brush', this)">✏️<span>Кисть</span></button>
        <button id="eraserBtn" class="tool-btn" title="Ластик" onclick="selectTool('eraser', this)">🧹<span>Ластик</span></button>
        <button id="fillBtn" class="tool-btn" title="Заливка" onclick="selectTool('fill', this)">💧<span>Заливка</span></button>
      </div>
      <div class="tool-group">
        <button id="rectBtn" class="tool-btn" title="Прямоугольник" onclick="selectTool('rect', this)">⬛<span>Прям.</span></button>
        <button id="circleBtn" class="tool-btn" title="Окружность" onclick="selectTool('circle', this)">⚪<span>Круг</span></button>
        <button id="lineBtn" class="tool-btn" title="Линия" onclick="selectTool('line', this)">╱<span>Линия</span></button>
      </div>
    </div>

    <div class="toolbar-row" style="border-top: 1px solid #383844; border-bottom: 1px solid #383844; padding: 3px 0;">
      <div class="tool-group" style="flex: 1;">
        <input type="color" id="brushColor" value="#000000" title="Цвет">
        <span style="font-size: 10px; color: #aaa;">Толщина:</span>
        <input type="range" id="brushSize" min="1" max="50" value="5" style="width: 80px;" title="Толщина">
        <span id="brushSizeVal" style="font-size: 10px; width: 22px;">5px</span>
      </div>
      <div class="tool-group">
        <span style="font-size: 10px; color: #aaa;">Плотность:</span>
        <input type="range" id="brushOpacity" min="10" max="100" value="100" style="width: 65px;" title="Плотность">
      </div>
    </div>

    <div class="toolbar-row">
      <div class="tool-group">
        <button id="textBtn" class="tool-btn" title="Текст" onclick="selectTool('text', this)">💬<span>Текст</span></button>
        <button id="selectBtn" class="tool-btn" title="Маска" onclick="selectTool('select', this)">✂️<span>Маска</span></button>
        <button class="tool-btn" title="Копировать маску" onclick="executeCopyMask()">📋<span>Копия</span></button>
      </div>
      <div class="tool-group">
        <button id="onionToggleBtn" class="tool-btn active" title="Калька" onclick="toggleOnion(this)">🧅<span>Калька</span></button>
        <button class="tool-btn" title="Очистить" onclick="clearActiveCanvas()">🗑️<span>Очистка</span></button>
      </div>
    </div>
  </div>

  <!-- Рабочая область и Панель слоев -->
  <div id="workspace-layout">
    <div id="workspace">
      <div class="canvas-container" id="container"></div>
    </div>

    <!-- Правая панель слоев: Новые слои добавляются сверху, Фон всегда снизу -->
    <div id="layers-sidebar">
      <div class="history-group">
        <button title="Отмена" onclick="undoAction()">↩️</button>
        <button title="Повтор" onclick="redoAction()">↪️</button>
      </div>
      <button onclick="addNewCustomLayer()" style="background:#00d2ff; color:#000; border:none; border-radius:4px; padding:4px; font-weight:bold; font-size:10px; cursor:pointer;">+ Слой</button>
      <div id="layersListContainer" style="display: flex; flex-direction: column; gap: 4px;"></div>
      
      <select id="fpsSelector" title="Скорость воспроизведения (FPS)">
        <option value="6">6 FPS</option>
        <option value="8">8 FPS</option>
        <option value="12" selected>12 FPS</option>
        <option value="16">16 FPS</option>
        <option value="24">24 FPS</option>
      </select>
    </div>
  </div>

  <!-- Таймлайн кадров -->
  <div id="timeline-container">
    <button id="playBtn" title="Воспроизвести">▶</button>
    <div id="timeline"></div>
  </div>

  <!-- Модалки -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <h3>Настройки холста и фона</h3>
      <div class="modal-group">
        <label>Размер (px):</label>
        <div>
          <input type="number" id="canvasW" class="size-input" value="600"> ×
          <input type="number" id="canvasH" class="size-input" value="600">
        </div>
      </div>
      <div class="modal-group">
        <label>Цвет фона:</label>
        <select id="bgColor" style="padding: 4px; background:#3b3b4f; color:#fff; border:1px solid #555; border-radius:4px;">
          <option value="transparent">Прозрачный</option>
          <option value="#ffffff" selected>Белый</option>
          <option value="#000000">Чёрный</option>
          <option value="#ff4444">Красный</option>
        </select>
      </div>
      <div class="modal-group">
        <label>Фоновая картинка:</label>
        <input type="file" id="bgImageInput" accept="image/*" style="font-size: 11px; color:#ccc;">
      </div>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
        <button onclick="document.getElementById('settings-modal').style.display='none'" style="width:auto; padding:0 10px; background: #555;">Отмена</button>
        <button id="closeSettingsBtn" style="width:auto; padding:0 12px; background: #00d2ff; color: #000; font-weight: bold;">Применить</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="text-modal">
    <div class="modal">
      <h3>Добавить текст / титры</h3>
      <textarea id="textContent" placeholder="Введите реплику..." rows="4" style="padding: 8px; background:#3b3b4f; color:#fff; border:1px solid #555; border-radius:4px; width:100%; resize:vertical;"></textarea>
      <div class="modal-group">
        <label>Размер шрифта:</label>
        <input type="number" id="textSize" class="size-input" value="28">
      </div>
      <div class="modal-group">
        <label>Цвет обводки:</label>
        <input type="color" id="textStrokeColor" value="#000000">
      </div>
      <div class="modal-group">
        <label>Толщина обводки:</label>
        <input type="number" id="textStrokeWidth" class="size-input" value="3" min="0" max="10">
      </div>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
        <button onclick="document.getElementById('text-modal').style.display='none'" style="width:auto; padding:0 10px; background: #555;">Отмена</button>
        <button id="confirmTextBtn" style="width:auto; padding:0 10px; background: #00d2ff; color: #000; font-weight: bold;">Разместить</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="export-modal">
    <div class="modal">
      <h3>Экспорт анимации</h3>
      <label>Выберите формат:</label>
      <select id="exportFormat" style="padding: 6px; background:#3b3b4f; color:#fff; border:1px solid #555; border-radius:4px;">
        <option value="webm">WebM (видео с прозрачностью)</option>
        <option value="mp4">MP4 (видео)</option>
        <option value="gif">GIF (гиф-анимация)</option>
        <option value="zip">ZIP (пакет кадров PNG)</option>
      </select>
      <div id="exportStatus" style="font-size: 11px; color: #00d2ff; display: none;">Генерация файла... Подождите.</div>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
        <button onclick="document.getElementById('export-modal').style.display='none'" style="width:auto; padding:0 10px; background: #555;">Отмена</button>
        <button id="confirmExportBtn" style="width:auto; padding:0 10px; background: #00d2ff; color: #000; font-weight: bold;">Скачать</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="import-modal">
    <div class="modal">
      <h3>Настройка импорта медиа</h3>
      <div class="modal-group">
        <label>Целевой FPS:</label>
        <select id="importFps" style="padding: 4px; background:#3b3b4f; color:#fff; border:1px solid #555; border-radius:4px;">
          <option value="6">6 кадров/сек</option>
          <option value="12" selected>12 кадров/сек</option>
          <option value="24">24 кадра/сек (все кадры)</option>
        </select>
      </div>
      <p style="font-size: 11px; color: #aaa;">Импортируемые изображения или видео станут фоновым слоем.</p>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
        <button onclick="document.getElementById('import-modal').style.display='none'" style="width:auto; padding:0 10px; background: #555;">Отмена</button>
        <button id="confirmImportBtn" style="width:auto; padding:0 10px; background: #00d2ff; color: #000; font-weight: bold;">Импортировать</button>
      </div>
    </div>
  </div>

  <script>
    let width = 600, height = 600;
    // Порядок в массиве: Фон (внизу), Слой 1, Слой 2 (выше)
    let layers = [
      { id: 'bg', name: 'Фон', locked: true, visible: true, type: 'bg' },
      { id: 'layer1', name: 'Слой 1', locked: true, visible: true, type: 'draw' },
      { id: 'layer2', name: 'Слой 2', locked: false, visible: true, type: 'draw' }
    ];
    let activeLayerId = 'bg';

    const container = document.getElementById('container');
    let canvases = {};
    let contexts = {};

    function initCanvases() {
      container.innerHTML = '';
      canvases = {};
      contexts = {};

      // Рендерим холсты в порядке стека: Фон первый (внизу), кастомные слои поверх него
      let renderOrder = ['bg', ...layers.filter(l => l.type !== 'bg').map(l => l.id), 'onion', 'select'];
      
      renderOrder.forEach((id, idx) => {
        const c = document.createElement('canvas');
        c.id = `canvas-${id}`;
        c.width = width;
        c.height = height;
        c.style.zIndex = idx + 1;
        if (id === 'onion') { c.style.display = 'block'; c.style.opacity = '0.35'; c.style.pointerEvents = 'none'; }
        if (id === 'select') { c.style.pointerEvents = 'none'; }
        if (id !== 'bg' && id !== 'onion' && id !== 'select') {
          const lObj = layers.find(l => l.id === id);
          if (lObj && !lObj.visible) c.style.display = 'none';
        }
        container.appendChild(c);
        canvases[id] = c;
        contexts[id] = c.getContext('2d');
      });

      renderLayersSidebar();
      setBgColor();
    }

    function renderLayersSidebar() {
      const list = document.getElementById('layersListContainer');
      list.innerHTML = '';

      // Получаем кастомные слои (без фона)
      let customLayers = layers.filter(l => l.type !== 'bg');

      // На панель выводим слои так, чтобы САМЫЙ ВЕРХНИЙ слой был в самом верху списка интерфейса,
      // а фоновый слой всегда оставался в самом низу.
      // Сворачиваем массив в обратном порядке для отображения (свежие сверху)
      let displayCustom = [...customLayers].reverse();

      displayCustom.forEach((l) => {
        const originalIndex = customLayers.findIndex(item => item.id === l.id);
        const canUp = originalIndex < customLayers.length - 1;   // Вверх по списку означает увеличение индекса в массиве (выше визуально)
        const canDown = originalIndex > 0;
        list.appendChild(createLayerCardDOM(l, canUp, canDown, true));
      });

      // Фоновый слой всегда последним (внизу)
      const bgLayer = layers.find(l => l.type === 'bg');
      if (bgLayer) {
        list.appendChild(createLayerCardDOM(bgLayer, false, false, false));
      }
    }

    function createLayerCardDOM(l, canUp, canDown, allowDelete) {
      const card = document.createElement('div');
      card.className = `layer-card ${activeLayerId === l.id ? 'active' : ''}`;
      
      const header = document.createElement('div');
      header.className = 'layer-header';
      header.innerHTML = `<span>${l.name}</span>`;
      header.onclick = () => { activeLayerId = l.id; renderLayersSidebar(); };

      const row = document.createElement('div');
      row.className = 'layer-actions-row';

      const visBtn = document.createElement('button');
      visBtn.className = 'layer-btn';
      visBtn.innerHTML = l.visible ? '👁️' : '🚫';
      visBtn.title = 'Видимость';
      visBtn.onclick = (e) => { e.stopPropagation(); l.visible = !l.visible; initCanvases(); loadFrame(currentFrameIndex); };
      row.appendChild(visBtn);

      const lockBtn = document.createElement('button');
      lockBtn.className = 'layer-btn';
      lockBtn.innerHTML = l.locked ? '🔒' : '🔓';
      lockBtn.title = 'Закреплять на новых кадрах';
      lockBtn.onclick = (e) => { e.stopPropagation(); l.locked = !l.locked; renderLayersSidebar(); };
      row.appendChild(lockBtn);

      // Кнопки перемещения слоев (вверх / вниз)
      if (canUp) {
        let upBtn = document.createElement('button');
        upBtn.className = 'layer-btn';
        upBtn.innerHTML = '▲';
        upBtn.title = 'Выше';
        upBtn.onclick = (e) => { e.stopPropagation(); moveLayer(l.id, 1); };
        row.appendChild(upBtn);
      }

      if (canDown) {
        let downBtn = document.createElement('button');
        downBtn.className = 'layer-btn';
        downBtn.innerHTML = '▼';
        downBtn.title = 'Ниже';
        downBtn.onclick = (e) => { e.stopPropagation(); moveLayer(l.id, -1); };
        row.appendChild(downBtn);
      }

      if (allowDelete) {
        let delBtn = document.createElement('button');
        delBtn.className = 'layer-btn';
        delBtn.innerHTML = '❌';
        delBtn.onclick = (e) => { e.stopPropagation(); deleteLayer(l.id); };
        row.appendChild(delBtn);
      }

      card.appendChild(header);
      card.appendChild(row);
      return card;
    }

    function addNewCustomLayer() {
      const newId = 'layer_' + Date.now();
      const customCount = layers.filter(l => l.type !== 'bg').length;
      const newName = `Слой ${customCount + 1}`;
      
      // Каждый новый слой добавляется сверху (в конец массива кастомных слоев)
      let bg = layers.find(l => l.type === 'bg');
      let custom = layers.filter(l => l.type !== 'bg');
      custom.push({ id: newId, name: newName, locked: false, visible: true, type: 'draw' });
      
      layers = [bg, ...custom];
      activeLayerId = newId;
      initCanvases();
      loadFrame(currentFrameIndex);
    }

    function deleteLayer(id) {
      if (layers.filter(l => l.type !== 'bg').length <= 1) return alert('Нужен хотя бы один слой для рисования!');
      layers = layers.filter(l => l.id !== id);
      activeLayerId = layers.find(l => l.type !== 'bg').id;
      initCanvases();
      loadFrame(currentFrameIndex);
    }

    function moveLayer(id, direction) {
      let custom = layers.filter(l => l.type !== 'bg');
      let idx = custom.findIndex(l => l.id === id);
      if (idx < 0) return;
      let targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= custom.length) return;
      
      let temp = custom[idx];
      custom[idx] = custom[targetIdx];
      custom[targetIdx] = temp;

      let bg = layers.find(l => l.type === 'bg');
      layers = [bg, ...custom];
      initCanvases();
      loadFrame(currentFrameIndex);
    }

    let frames = [];
    let currentFrameIndex = 0;
    let undoStack = [];
    let redoStack = [];
    let isDrawing = false;
    let isPlaying = false;
    let showOnion = true;
    let playInterval = null;
    let currentTool = 'brush';
    let customBgImage = null;

    let selectionRect = null;
    let selectionStart = null;
    let shapeStart = null;

    const brushColor = document.getElementById('brushColor');
    const brushSize = document.getElementById('brushSize');
    const brushSizeVal = document.getElementById('brushSizeVal');
    const brushOpacity = document.getElementById('brushOpacity');
    const bgColor = document.getElementById('bgColor');
    const timeline = document.getElementById('timeline');
    const fpsSelector = document.getElementById('fpsSelector');

    brushSize.oninput = () => brushSizeVal.textContent = brushSize.value + 'px';

    function updateCanvasDimensions(w, h) {
      width = w; height = h;
      initCanvases();
      if (frames.length > 0) loadFrame(currentFrameIndex);
    }

    function selectTool(toolName, btnElement) {
      if (toolName === 'text') {
        document.getElementById('text-modal').style.display = 'flex';
        return;
      }
      currentTool = toolName;
      document.querySelectorAll('#toolbar .tool-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      if (toolName !== 'select') clearSelection();
    }

    function toggleOnion(btnElement) {
      showOnion = !showOnion;
      btnElement.classList.toggle('active', showOnion);
      canvases['onion'].style.display = showOnion ? 'block' : 'none';
    }

    function setBgColor() {
      if (!contexts['bg']) return;
      if (!customBgImage && bgColor.value !== 'transparent') {
        contexts['bg'].fillStyle = bgColor.value;
        contexts['bg'].fillRect(0, 0, width, height);
      }
    }

    document.getElementById('bgImageInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          customBgImage = img;
          if (contexts['bg']) {
            contexts['bg'].clearRect(0, 0, width, height);
            contexts['bg'].drawImage(customBgImage, 0, 0, width, height);
          }
          saveCurrentFrame();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    function saveUndoState() {
      if (!contexts[activeLayerId]) return;
      undoStack.push(contexts[activeLayerId].getImageData(0, 0, width, height));
      redoStack = [];
      if (undoStack.length > 15) undoStack.shift();
    }

    function undoAction() {
      if (undoStack.length > 0 && contexts[activeLayerId]) {
        redoStack.push(contexts[activeLayerId].getImageData(0, 0, width, height));
        contexts[activeLayerId].putImageData(undoStack.pop(), 0, 0);
      }
    }

    function redoAction() {
      if (redoStack.length > 0 && contexts[activeLayerId]) {
        undoStack.push(contexts[activeLayerId].getImageData(0, 0, width, height));
        contexts[activeLayerId].putImageData(redoStack.pop(), 0, 0);
      }
    }

    function getCoords(e) {
      const rect = canvases[activeLayerId].getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.floor((clientX - rect.left) * (width / rect.width)),
        y: Math.floor((clientY - rect.top) * (height / rect.height))
      };
    }

    function floodFill(startX, startY, fillColorHex) {
      if (startX < 0 || startX >= width || startY < 0 || startY >= height) return;
      const ctx = contexts[activeLayerId];
      if (!ctx) return;
      saveUndoState();

      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      const fillR = parseInt(fillColorHex.slice(1, 3), 16);
      const fillG = parseInt(fillColorHex.slice(3, 5), 16);
      const fillB = parseInt(fillColorHex.slice(5, 7), 16);
      const fillA = Math.round((brushOpacity.value / 100) * 255);

      const startPos = (startY * width + startX) * 4;
      const startR = data[startPos], startG = data[startPos + 1], startB = data[startPos + 2], startA = data[startPos + 3];

      if (startR === fillR && startG === fillG && startB === fillB && startA === fillA) return;

      const queue = [startX, startY];
      const visited = new Uint8Array(width * height);

      while (queue.length > 0) {
        const y = queue.pop();
        const x = queue.pop();
        const idx = y * width + x;

        if (visited[idx]) continue;
        visited[idx] = 1;

        const pos = idx * 4;
        const isMatch = Math.abs(data[pos] - startR) < 30 &&
                        Math.abs(data[pos + 1] - startG) < 30 &&
                        Math.abs(data[pos + 2] - startB) < 30 &&
                        Math.abs(data[pos + 3] - startA) < 30;

        if (isMatch) {
          data[pos] = fillR;
          data[pos + 1] = fillG;
          data[pos + 2] = fillB;
          data[pos + 3] = fillA;

          if (x > 0) queue.push(x - 1, y);
          if (x < width - 1) queue.push(x + 1, y);
          if (y > 0) queue.push(x, y - 1);
          if (y < height - 1) queue.push(x, y + 1);
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    document.getElementById('confirmTextBtn').onclick = () => {
      const text = document.getElementById('textContent').value;
      const fontSize = parseInt(document.getElementById('textSize').value) || 28;
      const strokeColor = document.getElementById('textStrokeColor').value;
      const strokeWidth = parseInt(document.getElementById('textStrokeWidth').value) || 0;
      document.getElementById('text-modal').style.display = 'none';
      if (!text || !contexts[activeLayerId]) return;

      saveUndoState();
      const ctx = contexts[activeLayerId];
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.fillStyle = brushColor.value;
      ctx.globalAlpha = brushOpacity.value / 100;
      
      const lines = text.split('\n');
      let startY = height / 2 - ((lines.length - 1) * fontSize * 0.6);

      lines.forEach((line, index) => {
        const metrics = ctx.measureText(line);
        const lineX = width / 2 - metrics.width / 2;
        const lineY = startY + (index * fontSize * 1.2);

        if (strokeWidth > 0) {
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = strokeWidth;
          ctx.strokeText(line, lineX, lineY);
        }
        ctx.fillText(line, lineX, lineY);
      });
      ctx.globalAlpha = 1.0;
    };

    function drawSelectionRect() {
      contexts['select'].clearRect(0, 0, width, height);
      if (!selectionRect) return;
      contexts['select'].strokeStyle = '#00d2ff';
      contexts['select'].lineWidth = 2;
      contexts['select'].setLineDash([4, 4]);
      contexts['select'].strokeRect(selectionRect.x, selectionRect.y, selectionRect.w, selectionRect.h);
      contexts['select'].fillStyle = 'rgba(0, 210, 255, 0.15)';
      contexts['select'].fillRect(selectionRect.x, selectionRect.y, selectionRect.w, selectionRect.h);
    }

    function clearSelection() {
      selectionRect = null;
      if (contexts['select']) contexts['select'].clearRect(0, 0, width, height);
    }

    function startDrawing(e) {
      e.preventDefault();
      const coords = getCoords(e);
      const ctx = contexts[activeLayerId];
      if (!ctx) return;

      if (currentTool === 'fill') {
        floodFill(coords.x, coords.y, brushColor.value);
        return;
      }

      if (currentTool === 'select') {
        selectionStart = coords;
        selectionRect = { x: coords.x, y: coords.y, w: 0, h: 0 };
        isDrawing = true;
        return;
      }

      if (['rect', 'circle', 'line'].includes(currentTool)) {
        shapeStart = coords;
        saveUndoState();
        isDrawing = true;
        return;
      }

      saveUndoState();
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(coords.x, coords.y);
    }

    function draw(e) {
      if (!isDrawing || currentTool === 'fill') return;
      e.preventDefault();
      const coords = getCoords(e);
      const ctx = contexts[activeLayerId];
      if (!ctx) return;

      if (currentTool === 'select') {
        const x = Math.min(selectionStart.x, coords.x);
        const y = Math.min(selectionStart.y, coords.y);
        const w = Math.abs(coords.x - selectionStart.x);
        const h = Math.abs(coords.y - selectionStart.y);
        selectionRect = { x, y, w, h };
        drawSelectionRect();
        return;
      }

      if (['rect', 'circle', 'line'].includes(currentTool)) {
        ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
        ctx.strokeStyle = brushColor.value;
        ctx.lineWidth = brushSize.value;
        ctx.globalAlpha = brushOpacity.value / 100;

        if (currentTool === 'rect') {
          ctx.strokeRect(shapeStart.x, shapeStart.y, coords.x - shapeStart.x, coords.y - shapeStart.y);
        } else if (currentTool === 'circle') {
          let rx = Math.abs(coords.x - shapeStart.x) / 2;
          let ry = Math.abs(coords.y - shapeStart.y) / 2;
          let cx = shapeStart.x + (coords.x - shapeStart.x) / 2;
          let cy = shapeStart.y + (coords.y - shapeStart.y) / 2;
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI);
          ctx.stroke();
        } else if (currentTool === 'line') {
          ctx.beginPath();
          ctx.moveTo(shapeStart.x, shapeStart.y);
          ctx.lineTo(coords.x, coords.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1.0;
        return;
      }

      if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = 'rgba(0,0,0,1)';
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = brushColor.value;
      }

      ctx.lineWidth = brushSize.value;
      ctx.globalAlpha = brushOpacity.value / 100;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineTo(coords.x, coords.y);
      ctx.stroke();
    }

    function stopDrawing() { 
      isDrawing = false;
      Object.values(contexts).forEach(c => {
        if (c) { c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1.0; }
      });
    }

    container.addEventListener('mousedown', startDrawing);
    container.addEventListener('mousemove', draw);
    container.addEventListener('mouseup', stopDrawing);
    container.addEventListener('mouseleave', stopDrawing);

    container.addEventListener('touchstart', startDrawing, { passive: false });
    container.addEventListener('touchmove', draw, { passive: false });
    container.addEventListener('touchend', stopDrawing);

    function clearActiveCanvas() {
      if (!contexts[activeLayerId]) return;
      saveUndoState();
      contexts[activeLayerId].clearRect(0, 0, width, height);
      clearSelection();
    }

    function executeCopyMask() {
      if (!selectionRect || selectionRect.w <= 0 || selectionRect.h <= 0 || !contexts[activeLayerId]) {
        return alert('Сначала выделите область с помощью ✂️ Маска!');
      }

      const maskedData = contexts[activeLayerId].getImageData(selectionRect.x, selectionRect.y, selectionRect.w, selectionRect.h);
      const targetX = selectionRect.x;
      const targetY = selectionRect.y;

      addNewFrame();
      contexts[activeLayerId].putImageData(maskedData, targetX, targetY);
      clearSelection();
    }

    function saveCurrentFrame() {
      let frameData = {};
      layers.forEach(l => {
        if (contexts[l.id]) {
          frameData[l.id] = contexts[l.id].getImageData(0, 0, width, height);
        }
      });

      if (currentFrameIndex < frames.length) {
        frames[currentFrameIndex] = frameData;
      } else {
        frames.push(frameData);
      }
      updateTimeline();
    }

    function addNewFrame() {
      saveCurrentFrame();

      let prevDrawUrl = canvases['layer1'] ? canvases['layer1'].toDataURL('image/png') : '';

      layers.forEach(l => {
        if (contexts[l.id] && !l.locked) {
          contexts[l.id].clearRect(0, 0, width, height);
        }
      });

      undoStack = [];
      redoStack = [];
      currentFrameIndex = frames.length;

      if (contexts['onion']) {
        contexts['onion'].clearRect(0, 0, width, height);
        if (prevDrawUrl) {
          const prevImg = new Image();
          prevImg.onload = () => contexts['onion'].drawImage(prevImg, 0, 0);
          prevImg.src = prevDrawUrl;
        }
      }

      updateTimeline();
    }

    function moveFrame(index, direction) {
      saveCurrentFrame();
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= frames.length) return;
      const temp = frames[index];
      frames[index] = frames[targetIndex];
      frames[targetIndex] = temp;
      currentFrameIndex = targetIndex;
      loadFrame(currentFrameIndex);
    }

    function duplicateFrame(index) {
      saveCurrentFrame();
      const src = frames[index];
      let copy = {};
      Object.keys(src).forEach(k => {
        copy[k] = new ImageData(new Uint8ClampedArray(src[k].data), src[k].width, src[k].height);
      });
      frames.splice(index + 1, 0, copy);
      currentFrameIndex = index + 1;
      loadFrame(currentFrameIndex);
    }

    function deleteFrame(index) {
      if (frames.length <= 1) return alert('Нельзя удалить единственный кадр!');
      frames.splice(index, 1);
      currentFrameIndex = Math.min(index, frames.length - 1);
      loadFrame(currentFrameIndex);
    }

    function updateTimeline() {
      timeline.innerHTML = '';
      const thumbCanvas = document.createElement('canvas');
      thumbCanvas.width = width;
      thumbCanvas.height = height;
      const thumbCtx = thumbCanvas.getContext('2d');

      frames.forEach((frameObj, idx) => {
        thumbCtx.clearRect(0, 0, width, height);
        layers.forEach(l => {
          if (frameObj[l.id]) thumbCtx.putImageData(frameObj[l.id], 0, 0);
        });
        const thumbUrl = thumbCanvas.toDataURL('image/png');

        const thumb = document.createElement('div');
        thumb.className = `thumb ${idx === currentFrameIndex ? 'active' : ''}`;
        thumb.style.backgroundImage = `url(${thumbUrl})`;
        thumb.onclick = () => loadFrame(idx);

        const actions = document.createElement('div');
        actions.className = 'thumb-actions';
        
        if (idx > 0) {
          let moveLeft = document.createElement('div');
          moveLeft.className = 'thumb-action-btn';
          moveLeft.innerHTML = '◀';
          moveLeft.onclick = (e) => { e.stopPropagation(); moveFrame(idx, -1); };
          actions.appendChild(moveLeft);
        }

        let dup = document.createElement('div');
        dup.className = 'thumb-action-btn';
        dup.innerHTML = '📋';
        dup.onclick = (e) => { e.stopPropagation(); duplicateFrame(idx); };
        actions.appendChild(dup);

        let del = document.createElement('div');
        del.className = 'thumb-action-btn';
        del.innerHTML = '❌';
        del.onclick = (e) => { e.stopPropagation(); deleteFrame(idx); };
        actions.appendChild(del);

        if (idx < frames.length - 1) {
          let moveRight = document.createElement('div');
          moveRight.className = 'thumb-action-btn';
          moveRight.innerHTML = '▶';
          moveRight.onclick = (e) => { e.stopPropagation(); moveFrame(idx, 1); };
          actions.appendChild(moveRight);
        }

        thumb.appendChild(actions);
        timeline.appendChild(thumb);
      });

      const addThumb = document.createElement('div');
      addThumb.className = 'thumb-add';
      addThumb.innerHTML = '+';
      addThumb.onclick = addNewFrame;
      timeline.appendChild(addThumb);
    }

    function loadFrame(index) {
      saveCurrentFrame();
      currentFrameIndex = index;
      Object.keys(contexts).forEach(k => {
        if (k !== 'onion' && k !== 'select' && contexts[k]) contexts[k].clearRect(0, 0, width, height);
      });
      undoStack = [];
      redoStack = [];
      clearSelection();
      
      const frameObj = frames[index];
      layers.forEach(l => {
        if (frameObj[l.id] && contexts[l.id]) {
          contexts[l.id].putImageData(frameObj[l.id], 0, 0);
        }
      });

      if (contexts['onion']) {
        contexts['onion'].clearRect(0, 0, width, height);
        if (index > 0 && frames[index - 1]['layer1']) {
          const prevThumbCanvas = document.createElement('canvas');
          prevThumbCanvas.width = width; prevThumbCanvas.height = height;
          const pCtx = prevThumbCanvas.getContext('2d');
          pCtx.putImageData(frames[index - 1]['layer1'], 0, 0);
          
          const prevImg = new Image();
          prevImg.onload = () => contexts['onion'].drawImage(prevImg, 0, 0);
          prevImg.src = prevThumbCanvas.toDataURL('image/png');
        }
      }
      updateTimeline();
    }

    if (frames.length === 0) initCanvases(), addNewFrame();

    const playBtn = document.getElementById('playBtn');
    playBtn.onclick = function() {
      if (isPlaying) {
        clearInterval(playInterval);
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
        isPlaying = false;
        loadFrame(currentFrameIndex);
        return;
      }
      if (frames.length === 0) return;
      saveCurrentFrame();
      playBtn.textContent = '⏹';
      playBtn.classList.add('playing');
      isPlaying = true;
      let i = 0;

      const fps = parseInt(fpsSelector.value) || 12;
      const intervalMs = 1000 / fps;

      playInterval = setInterval(() => {
        Object.keys(contexts).forEach(k => {
          if (k !== 'onion' && k !== 'select' && contexts[k]) contexts[k].clearRect(0, 0, width, height);
        });
        
        layers.forEach(l => {
          if (frames[i][l.id] && contexts[l.id]) {
            contexts[l.id].putImageData(frames[i][l.id], 0, 0);
          }
        });

        i = (i + 1) % frames.length;
      }, intervalMs);
    };

    document.getElementById('saveProjectBtn').onclick = () => {
      saveCurrentFrame();
      const exportFrames = frames.map(f => {
        let fObj = {};
        let c = document.createElement('canvas'); c.width = width; c.height = height;
        let tCtx = c.getContext('2d');
        Object.keys(f).forEach(k => {
          tCtx.clearRect(0, 0, width, height);
          tCtx.putImageData(f[k], 0, 0);
          fObj[k] = c.toDataURL();
        });
        return fObj;
      });
      const projectData = JSON.stringify({ width, height, layers, frames: exportFrames, bgColor: bgColor.value });
      const blob = new Blob([projectData], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'animation_project.json';
      a.click();
    };

    document.getElementById('loadProjectBtn').onclick = () => document.getElementById('loadProjectInput').click();
    document.getElementById('loadProjectInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (evt) => {
        const data = JSON.parse(evt.target.result);
        width = data.width || 600;
        height = data.height || 600;
        document.getElementById('canvasW').value = width;
        document.getElementById('canvasH').value = height;
        bgColor.value = data.bgColor || 'transparent';
        if (data.layers) layers = data.layers;
        initCanvases();

        frames = [];
        for (let fData of data.frames) {
          let fObj = {};
          let c = document.createElement('canvas'); c.width = width; c.height = height;
          let ctx = c.getContext('2d');

          for (let k of Object.keys(fData)) {
            await new Promise(r => {
              let img = new Image();
              img.onload = () => {
                ctx.clearRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0);
                fObj[k] = ctx.getImageData(0, 0, width, height);
                r();
              };
              img.src = fData[k];
            });
          }
          frames.push(fObj);
        }
        loadFrame(0);
      };
      reader.readAsText(file);
    };

    let pendingMediaFiles = [];
    document.getElementById('importMediaBtn').onclick = () => document.getElementById('mediaFileInput').click();
    document.getElementById('mediaFileInput').onchange = (e) => {
      pendingMediaFiles = Array.from(e.target.files);
      if (pendingMediaFiles.length > 0) {
        document.getElementById('import-modal').style.display = 'flex';
      }
    };

    document.getElementById('confirmImportBtn').onclick = async () => {
      document.getElementById('import-modal').style.display = 'none';
      const targetFps = parseInt(document.getElementById('importFps').value) || 12;

      for (let file of pendingMediaFiles) {
        if (file.type.startsWith('video/')) {
          await importVideoFileAsBackground(file, targetFps);
        } else {
          await importStaticImageAsBackground(file);
        }
      }
      updateTimeline();
      loadFrame(frames.length - 1);
    };

    async function importVideoFileAsBackground(file, targetFps) {
      return new Promise((resolve) => {
        const video = document.createElement('video');
        video.src = URL.createObjectURL(file);
        video.muted = true;
        video.playsInline = true;
        video.onloadeddata = async () => {
          video.play();
          const duration = video.duration;
          const sourceFps = 24;
          const step = Math.max(1, Math.round(sourceFps / targetFps));
          const totalFrames = Math.floor(duration * sourceFps);

          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');

          for (let f = 0; f < totalFrames; f += step) {
            video.currentTime = f / sourceFps;
            await new Promise(r => { video.onseeked = r; });
            ctx.clearRect(0, 0, width, height);
            ctx.drawImage(video, 0, 0, width, height);

            let frameObj = {};
            layers.forEach(l => {
              if (l.type === 'bg') {
                frameObj[l.id] = ctx.getImageData(0, 0, width, height);
              } else {
                let emptyC = document.createElement('canvas'); emptyC.width = width; emptyC.height = height;
                frameObj[l.id] = emptyC.getContext('2d').getImageData(0, 0, width, height);
              }
            });
            frames.push(frameObj);
          }
          resolve();
        };
      });
    }

    async function importStaticImageAsBackground(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            let frameObj = {};
            layers.forEach(l => {
              if (l.type === 'bg') {
                frameObj[l.id] = ctx.getImageData(0, 0, width, height);
              } else {
                let emptyC = document.createElement('canvas'); emptyC.width = width; emptyC.height = height;
                frameObj[l.id] = emptyC.getContext('2d').getImageData(0, 0, width, height);
              }
            });
            frames.push(frameObj);
            resolve();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    const settingsModal = document.getElementById('settings-modal');
    document.getElementById('settingsBtn').onclick = () => settingsModal.style.display = 'flex';
    document.getElementById('closeSettingsBtn').onclick = () => {
      settingsModal.style.display = 'none';
      const w = parseInt(document.getElementById('canvasW').value) || 600;
      const h = parseInt(document.getElementById('canvasH').value) || 600;
      updateCanvasDimensions(w, h);
    };

    async function renderCombinedFrame(frameObj, targetCanvas) {
      const ctx = targetCanvas.getContext('2d');
      ctx.clearRect(0, 0, width, height);

      if (customBgImage) {
        ctx.drawImage(customBgImage, 0, 0, width, height);
      } else if (bgColor.value !== 'transparent') {
        ctx.fillStyle = bgColor.value;
        ctx.fillRect(0, 0, width, height);
      }

      layers.forEach(l => {
        if (l.visible && frameObj[l.id]) {
          ctx.putImageData(frameObj[l.id], 0, 0);
        }
      });
    }

    const exportModal = document.getElementById('export-modal');
    document.getElementById('exportVideoBtn').onclick = () => {
      saveCurrentFrame();
      if (frames.length === 0) return alert('Нет кадров для экспорта!');
      exportModal.style.display = 'flex';
    };

    document.getElementById('confirmExportBtn').onclick = async () => {
      const format = document.getElementById('exportFormat').value;
      const statusEl = document.getElementById('exportStatus');
      statusEl.style.display = 'block';

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = width;
      exportCanvas.height = height;

      if (format === 'zip') {
        const zip = new JSZip();
        const folder = zip.folder("animation_frames");

        for (let i = 0; i < frames.length; i++) {
          await renderCombinedFrame(frames[i], exportCanvas);
          const dataUrl = exportCanvas.toDataURL('image/png');
          const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");
          folder.file(`frame_${String(i + 1).padStart(3, '0')}.png`, base64Data, {base64: true});
        }

        const content = await zip.generateAsync({type:"blob"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = 'animation_frames.zip';
        a.click();
        statusEl.style.display = 'none';
        exportModal.style.display = 'none';
        return;
      }

      if (format === 'gif') {
        const fps = parseInt(fpsSelector.value) || 12;
        const gif = new GIF({
          workers: 2,
          quality: 10,
          width: width,
          height: height,
          transparent: bgColor.value === 'transparent' ? 0x000000 : null
        });

        for (let i = 0; i < frames.length; i++) {
          await renderCombinedFrame(frames[i], exportCanvas);
          gif.addFrame(exportCanvas, {copy: true, delay: Math.round(1000 / fps)});
        }

        gif.on('finished', function(blob) {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'animation.gif';
          a.click();
          statusEl.style.display = 'none';
          exportModal.style.display = 'none';
        });

        gif.render();
        return;
      }

      const stream = exportCanvas.captureStream(0);
      let mimeType = format === 'mp4' ? 'video/mp4' : 'video/webm';
      let recorder;
      try {
        recorder = new MediaRecorder(stream, { mimeType: mimeType });
      } catch (err) {
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      }

      const chunks = [];
      recorder.ondataavailable = e => e.data.size > 0 && chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: recorder.mimeType });
        const ext = recorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `animation.${ext}`;
        a.click();
        statusEl.style.display = 'none';
        exportModal.style.display = 'none';
      };

      recorder.start();
      const track = stream.getVideoTracks()[0];
      const fps = parseInt(fpsSelector.value) || 12;

      for (let i = 0; i < frames.length; i++) {
        await renderCombinedFrame(frames[i], exportCanvas);
        if (track.requestFrame) track.requestFrame();
        await new Promise(r => setTimeout(r, 1000 / fps));
      }
      recorder.stop();
    };
  </script>
</body>
</html>
